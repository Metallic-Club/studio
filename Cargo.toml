[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "LicenseRef-Metallic-Proprietary"
publish = false

[workspace.dependencies]
metallic_core = { path = "crates/metallic_core" }
