[workspace]
resolver = "3"
members = ["crates/*", "apps/*", "xtask"]
# `metallic_engine` (and through it every app) is what most commands build; `cargo build` at the root builds everything.
default-members = ["crates/*", "apps/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license-file = "LICENSE"
repository = "https://github.com/Metallic-Club/studio"
publish = false

[workspace.dependencies]
# Engine crates. The arrows between them are fixed by docs/adr/0001-project-layout.md; `cargo xtask check-layout`
# enforces them.
metallic_core = { path = "crates/core" }
metallic_classes = { path = "crates/classes" }
metallic_script = { path = "crates/script" }
metallic_luau = { path = "crates/luau" }
metallic_render = { path = "crates/render" }
metallic_physics = { path = "crates/physics" }
metallic_project = { path = "crates/project" }
# Without its `window` feature (winit, gilrs): a dedicated server gets user paths only. `metallic_engine`'s `render`
# feature turns it on (#92).
metallic_platform = { path = "crates/platform", default-features = false }
metallic_engine = { path = "crates/engine", default-features = false }
metallic_player = { path = "apps/player" }

# Third-party crates. `metallic_core` may only use small, portable ones (ADR 0002): glam, serde, thiserror.
# `serde_json` writes and reads scene files (`metallic_project`, ADR 0006) and serves `xtask` and tests. Pure Rust.
glam = { version = "0.34", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2"
# Benchmarks only (dev-dependency); default features off to skip plotting and rayon.
criterion = { version = "0.8", default-features = false }
# Instruction-count benchmarks for the perf gate (dev-dependency; docs/perf.md). Pinned exactly: the
# `gungraun-runner` binary the perf workflow installs must be the same version.
gungraun = "=0.20.0"
# The Luau VM of `metallic_luau` (ADR 0003), built from the vendored C++ sources so every target runs the same Luau.
mlua = { version = "0.12.2", default-features = false, features = ["luau", "vendored"] }
# Window, event loop and input for `metallic_platform` (ADR 0004). X11 and Wayland on Linux, both loaded at run time
# (no system packages to build). Wayland window decorations are drawn without a title: the titled variant pulls a
# font stack whose `ttf-parser` is unmaintained (RUSTSEC-2026-0192). crates/platform/Cargo.toml adds the Android
# activity backend.
winit = { version = "0.30.13", default-features = false, features = [
    "rwh_06",
    "x11",
    "wayland",
    "wayland-dlopen",
    "wayland-csd-adwaita-notitle",
] }
# The window and display handles `metallic_render` receives (ADR 0001 rule 4). Same major version as winit's
# `rwh_06` and wgpu.
raw-window-handle = "0.6.2"
# Desktop gamepads for `metallic_platform` (Windows, Linux, macOS only).
gilrs = "0.11.2"
# Parses and writes `metallic.toml`, the project manifest (`metallic_project`, ADR 0006). Pure Rust, no proc-macros.
toml = "1.2"
# Reads and writes `.mtproj` project archives (`metallic_project`, ADR 0006): deflate and stored members only, pure
# Rust (zlib-rs), no C libraries and none of the other codecs or encryption.
zip = { version = "9.4", default-features = false, features = ["deflate-flate2-zlib-rs"] }
# The CRC-32 of unsaved members, to match moved assets (`metallic_project`'s asset index, #188); saved members' CRCs
# come from the zip archive. Already in the tree via zip. Pure Rust.
crc32fast = "1.5"
# Random asset ids (`metallic_project`'s asset index, #188) from the operating system. Already in the tree via zip.
getrandom = { version = "0.4", default-features = false }
# Logging facade; the app that ships picks the logger.
log = "0.4"
# The Player binary's command line (`--bench`, `--scene`, `--preset`). No dependencies, no proc-macros.
lexopt = "0.3"
# Profiling scopes in `metallic_engine`'s frame loop. With no back end feature the macros expand to nothing; the
# engine's `profile-with-puffin` and `profile-with-tracy` features pick one. No proc-macros (`procmacros` is off).
profiling = { version = "1.0.18", default-features = false }
# The GPU layer of `metallic_render` (ADR 0004, ADR 0008): Vulkan, Metal, DX12, and GLES as the fallback. The web
# backend is off; `wgsl` compiles our shaders with naga.
wgpu = { version = "30.0.1", default-features = false, features = ["std", "parking_lot", "vulkan", "metal", "dx12", "gles", "wgsl"] }
# Blocks on wgpu's adapter and device requests during setup (never inside a frame).
pollster = "1.0.1"
# Plain-old-data casts for GPU buffer contents (`metallic_render`'s instance records). Already in the tree via wgpu.
bytemuck = { version = "1.25", features = ["derive"] }
# Decodes PNG textures (`metallic_project`'s asset decoding, #189), and reads and writes the renderer's reference images
# in its image tests. Pure Rust.
png = "0.18"
# Decodes glTF and GLB models (`metallic_project`'s asset decoding, #189). Without `import`: no `image` crate, no
# reading of files by path; the project resolves a model's buffers itself. `utils` reads accessors. Pure Rust.
gltf = { version = "1.4", default-features = false, features = ["utils"] }
# Decodes JPEG textures (`metallic_project`'s asset decoding, #189). Pure Rust; its SIMD paths are chosen at run time
# on x86 and are plain NEON on ARM.
zune-jpeg = "0.5"
# Studio's interface (ADR 0009): egui 0.37, built for wgpu 30, drawn by `egui-wgpu` on the engine's device and fed
# by `egui-winit` from Studio's own winit loop (not eframe, which owns the device and the loop). Desktop only: these
# are Studio's alone, and the Android and iOS checks exclude it. `default_fonts` is off: Studio bundles its own OFL
# fonts (apps/studio/assets/fonts), and egui's include one under the Ubuntu Font Licence, which deny.toml rejects.
egui = { version = "0.37.0", default-features = false }
# Without its defaults, which turn on winit's (the titled Wayland decorations, RUSTSEC-2026-0192) and opening links.
# `clipboard` is the system clipboard (#538): arboard, and smithay-clipboard on Wayland, so text copies between
# Studio and other apps. arboard's Windows backend `clipboard-win` is BSL-1.0, which deny.toml allows for it.
egui-winit = { version = "0.37.0", default-features = false, features = ["clipboard", "x11", "wayland"] }
# Without its defaults (wgpu's default features, WebGL). Only `egui_wgpu::Renderer` is used: the surface is the
# engine's `RenderSurface`.
egui-wgpu = { version = "0.37.0", default-features = false }
# Studio's UI tests (dev-dependency): feeds input to egui and queries its widgets through AccessKit, no GPU.
egui_kittest = { version = "0.37.0", default-features = false }
# Studio's docking (ADR 0009, Docking): tabs and splits the user drags around. egui_dock has no release for egui 0.37
# (its newest, 0.21, is built for egui 0.36), so this is egui_tiles, the egui authors' own docking crate, which is.
# `serde` saves the layout as JSON. MIT OR Apache-2.0, pure Rust.
egui_tiles = { version = "0.18.0", features = ["serde"] }
# The local time of day on Studio's Output lines (#502). Only its clock: no serde, no formatting locales. MIT or Apache-2.0.
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
# The script editor's find and replace (#554): regular expressions, with the `$1` of a replacement. Already in the
# tree (via the build's tools), pure Rust, MIT OR Apache-2.0.
regex = "1.12"
# Checks a font file the user picks for the script editor (#529) before egui loads it: egui reads fonts with it already
# (the same version and features), so it adds nothing to the build. MIT OR Apache-2.0, pure Rust.
skrifa = { version = "0.44.0", default-features = false, features = ["std", "autohint_shaping"] }
# Studio's native file dialogs (pick a `.mtproj`, pick a folder). Desktop only, like egui. On Linux it asks the XDG
# desktop portal over D-Bus (no GTK); on Windows and macOS it shows the system's own dialogs. MIT.
rfd = { version = "0.17", default-features = false, features = ["xdg-portal", "wayland"] }
# Rasterises the SVGs in Studio's custom icon folder (#231). Without its defaults: no text (fonts), no raster images
# inside an SVG, no gzip, so it is usvg, tiny-skia and their parsers. Apache-2.0 OR MIT (tiny-skia BSD-3-Clause).
resvg = { version = "0.49", default-features = false }
# Windows-only dev-dependency of `metallic_render`'s allocation tests, which keep the Direct3D 12 debug layer's
# messages away from wgpu-hal's message handler (crates/render/tests/no_alloc.rs, #125). Already in the tree via wgpu.
# Also `metallic_platform`'s per-user file association (registry, shell notify) and Studio's splash window.
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Diagnostics_Debug", "Win32_System_Kernel"] }

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "deny"
unreachable_pub = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"
undocumented_unsafe_blocks = "warn"

# Your code is lightly optimised, dependencies fully: fast to build, fast enough to run.
[profile.dev]
opt-level = 1
[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

# `cargo build --profile dist`: the binaries that ship.
[profile.dist]
inherits = "release"
lto = "fat"
# Not "abort": Luau script errors are C++ exceptions that unwind through Rust frames (mlua's and metallic_luau's),
# which Rust only allows under "unwind"; with "abort" the first `error()` in a script would kill the game.
# metallic_luau refuses to compile under "abort" (crates/luau/src/ffi.rs).
panic = "unwind"
strip = true
