[package]
name = "metallic_player"
description = "Metallic Player: runs games (a library embedded by Studio and Launcher, plus a binary)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
default = ["full"]
# Everything a client needs. A dedicated server will depend on `metallic_engine` with fewer features instead.
full = ["metallic_engine/render", "metallic_engine/physics", "metallic_engine/luau"]

[dependencies]
# A window and Luau scripts are what the Player is, so those two are on whatever the features say.
metallic_engine = { workspace = true, features = ["render", "luau"] }
lexopt.workspace = true
log.workspace = true
thiserror.workspace = true

# An exported game says why it cannot start in a message box (#803). Desktop only, as rfd is.
[target.'cfg(any(windows, target_os = "macos", target_os = "linux"))'.dependencies]
rfd.workspace = true
