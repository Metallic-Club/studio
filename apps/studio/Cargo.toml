[package]
name = "metallic_studio"
description = "Metallic Studio: the editor (Windows, Linux, macOS)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
metallic_engine = { workspace = true, features = ["render", "physics", "luau"] }
metallic_player.workspace = true
egui.workspace = true
egui-winit.workspace = true
egui-wgpu.workspace = true
winit.workspace = true
log.workspace = true
toml.workspace = true
thiserror.workspace = true
rfd.workspace = true

# The splash's window shape and the system's animation switch (src/app/native.rs).
[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
egui_kittest.workspace = true
# The offscreen screenshots (`docs/screenshots`), written by an ignored test.
png.workspace = true
