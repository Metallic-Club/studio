[package]
name = "metallic_studio"
description = "Metallic Studio: the editor (Windows, Linux, macOS)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
metallic_engine = { workspace = true, features = ["render", "physics", "luau"] }
metallic_player.workspace = true
egui.workspace = true
egui-winit.workspace = true
egui-wgpu.workspace = true
winit.workspace = true
log.workspace = true
toml.workspace = true
thiserror.workspace = true
rfd.workspace = true
# The Output's time of day (#502).
chrono.workspace = true
regex.workspace = true
# A font file of the user's is checked before it is loaded (#529).
skrifa.workspace = true
# The custom icon folder's SVGs and PNGs (src/theme/icons/custom.rs).
resvg.workspace = true
png.workspace = true
egui_tiles.workspace = true
# The saved dock layout (`layout.json`).
serde.workspace = true
serde_json.workspace = true
# The command line: a project to open, `--register-file-types` (src/cli.rs), as the Player parses its own.
lexopt.workspace = true

# The splash's window shape and the system's animation switch (src/app/native.rs).
[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
egui_kittest.workspace = true
