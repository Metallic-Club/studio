name: Task
description: A unit of work an AI session or person can pick up
labels: ["type:task"]
body:
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: One or two lines.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Files / crates
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance
      description: Tests and checks that must pass.
    validations:
      required: true
  - type: textarea
    id: blockers
    attributes:
      label: Blocked by
      description: One "Blocked by #N" per line, or "none".
  - type: textarea
    id: refs
    attributes:
      label: Links
      description: Spec or plan sections.
