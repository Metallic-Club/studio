name: Release
# Cargo and dependency build scripts run on a separate read-only runner. Only the
# fresh packaging/upload job receives publishing credentials. No release cache.
on:
  push:
    tags:
      - "v*"

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read
    outputs:
      artifact-id: ${{ steps.binary.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Refuse tags that are not on main
        shell: bash
        run: |
          # fetch-depth: 0 already fetched all branches; no persisted token is needed.
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Tagged commit $GITHUB_SHA is not on main; merge first, then tag." >&2
            exit 1
          fi
      - name: Work out version and channel from the tag
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME}"
          if [[ ! "$tag" =~ ^v(([0-9]|[1-9][0-9]*)\.([0-9]|[1-9][0-9]*)\.([0-9]|[1-9][0-9]*))-(dev|stable)$ ]]; then
            echo "Tag '$tag' must look like v0.1.1-dev or v0.2.0-stable" >&2
            exit 1
          fi
          echo "RELEASE_VERSION=${BASH_REMATCH[1]}" >> "$GITHUB_ENV"
          echo "RELEASE_CHANNEL=${BASH_REMATCH[5]}" >> "$GITHUB_ENV"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Check the tag matches the workspace version
        shell: bash
        run: python -I tools/release.py --check-version --version "$RELEASE_VERSION"
      - name: Install Rust from rust-toolchain.toml
        shell: bash
        run: rustup toolchain install
      - name: Build without publishing credentials
        shell: bash
        run: python -I tools/release.py --build-only --channel "$RELEASE_CHANNEL" --version "$RELEASE_VERSION"
      - name: Hand off only the compiled executable
        id: binary
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: target/release/metallic-studio.exe
          archive: false
          if-no-files-found: error
          retention-days: 3

  publish:
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      # Fresh trusted source at the tagged SHA; never use build-job scripts.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Refuse tags that are not on main
        shell: bash
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Tagged commit $GITHUB_SHA is not on main; merge first, then tag." >&2
            exit 1
          fi
      - name: Work out version and channel from the tag
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME}"
          if [[ ! "$tag" =~ ^v(([0-9]|[1-9][0-9]*)\.([0-9]|[1-9][0-9]*)\.([0-9]|[1-9][0-9]*))-(dev|stable)$ ]]; then
            echo "Tag '$tag' must look like v0.1.1-dev or v0.2.0-stable" >&2
            exit 1
          fi
          echo "RELEASE_VERSION=${BASH_REMATCH[1]}" >> "$GITHUB_ENV"
          echo "RELEASE_CHANNEL=${BASH_REMATCH[5]}" >> "$GITHUB_ENV"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Check the tag matches the workspace version
        shell: bash
        run: python -I tools/release.py --check-version --version "$RELEASE_VERSION"
      - name: Install Velopack CLI (version pinned in tools/release.py)
        shell: bash
        run: |
          pinned="$(python -I tools/release.py --print-vpk-version)"
          dotnet tool install --global vpk --version "$pinned"
      - name: Install Pillow (icon conversion)
        run: python -m pip install Pillow==11.3.0
      - name: Download this run's immutable executable artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.build.outputs.artifact-id }}
          path: ${{ runner.temp }}/metallic-release-input
          skip-decompress: true
          digest-mismatch: error
      - name: Pack and publish without invoking Cargo
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_INPUT: ${{ runner.temp }}/metallic-release-input/metallic-studio.exe
        run: python -I tools/release.py --publish-only --input-exe "$RELEASE_INPUT" --channel "$RELEASE_CHANNEL" --version "$RELEASE_VERSION"
