name: Release
# Runs only when a tag like v0.1.1-dev or v0.2.0-stable (Studio) or launcher-v0.1.1-dev (Launcher)
# is pushed, and only for commits that are already on main. Builds the installer and publishes it
# as a GitHub Release with the workflow's own GITHUB_TOKEN (no other secrets). Actions are pinned to full commit SHAs.
on:
  push:
    tags:
      - "v*"
      - "launcher-v*"

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Refuse tags that are not on main
        shell: bash
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Tagged commit $GITHUB_SHA is not on main; merge first, then tag." >&2
            exit 1
          fi
      - name: Work out version and channel from the tag
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME}"
          app=studio
          if [[ "$tag" == launcher-v* ]]; then
            app=launcher
            tag="${tag#launcher-}"
          fi
          if [[ ! "$tag" =~ ^v(([0-9]|[1-9][0-9]*)\.([0-9]|[1-9][0-9]*)\.([0-9]|[1-9][0-9]*))-(dev|stable)$ ]]; then
            echo "Tag '$GITHUB_REF_NAME' must look like v0.1.1-dev, v0.2.0-stable or launcher-v0.1.1-dev" >&2
            exit 1
          fi
          echo "RELEASE_APP=$app" >> "$GITHUB_ENV"
          echo "RELEASE_VERSION=${BASH_REMATCH[1]}" >> "$GITHUB_ENV"
          echo "RELEASE_CHANNEL=${BASH_REMATCH[5]}" >> "$GITHUB_ENV"
      - name: Check the tag matches the workspace version
        shell: bash
        run: python tools/release.py --check-version --version "$RELEASE_VERSION"
      - name: Install Rust from rust-toolchain.toml
        shell: bash
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@720f7e45ccee46c12a7b1d7bed2ab733be9be5a1 # v2.7.6
      - name: Install Velopack CLI (version pinned in tools/release.py)
        shell: bash
        run: |
          pinned="$(python tools/release.py --print-vpk-version)"
          dotnet tool install --global vpk --version "$pinned"
      - name: Install Pillow (icon conversion)
        run: python -m pip install Pillow==11.3.0
      - name: Build, pack and publish
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python tools/release.py --app "$RELEASE_APP" --channel "$RELEASE_CHANNEL" --version "$RELEASE_VERSION"
