name: CI
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-lane-portability:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build lane guard tests (POSIX lock and symlinks)
        run: python -I tools/test_cargo_lane.py
      # The Launcher pages' WOFF2 fonts must match Studio's TTFs (same versions as the committed output).
      - name: Web fonts are up to date
        run: |
          python -m pip install --disable-pip-version-check fonttools==4.68.0 brotli==1.2.1
          python -I tools/gen_web_fonts.py --check

  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust from rust-toolchain.toml
        shell: bash
        run: |
          rustup toolchain install
          rustup component add clippy rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          # Only main saves: PR caches would evict main's from the 10 GB repo cache and leave cold builds.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny,cargo-nextest
      - name: Format
        run: cargo fmt --check
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build lane guard tests
        run: python -I tools/test_cargo_lane.py
      # nextest runs the ~140 test binaries in parallel; cargo test ran them one after another (~6 min).
      - name: Test
        run: cargo nextest run --workspace --profile ci
      - name: Doc tests
        run: cargo test --workspace --doc
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Licences
        run: cargo deny check licenses

  simulation-cpu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust from rust-toolchain.toml
        shell: bash
        run: |
          rustup toolchain install
          rustup component add clippy
      - uses: Swatinem/rust-cache@v2
        with:
          # Only main saves: PR caches would evict main's from the 10 GB repo cache and leave cold builds.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check CPU dependency policy
        run: |
          python -I tools/test_simulation_graph.py
          python -I tools/check_simulation_graph.py
      - name: Test graphics-free simulation and finite runner
        run: cargo test -p metallic_runtime --no-default-features --lib --bin metallic-sim --test simulation --test sim_runner --test simulation_touches --test local_input -j 4 -- --test-threads=1
      - name: Check all graphics-free targets
        run: cargo clippy -p metallic_runtime --no-default-features --all-targets -j 4 -- -D warnings

  # Proves the Windows/other `cfg` split compiles on Linux. It does not prove the Linux Launcher works.
  launcher-linux-check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust from rust-toolchain.toml
        shell: bash
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          # Only main saves: PR caches would evict main's from the 10 GB repo cache and leave cold builds.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libxdo-dev libayatana-appindicator3-dev
      - name: Check the Launcher and the update library
        run: cargo check -p metallic_launcher -p metallic_update
