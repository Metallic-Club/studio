# Checks every PR and every push to main. The same commands run locally; see AGENTS.md ("Check").
#
# Actions minutes are limited (free plan; Windows counts 2x, macOS 10x). PRs and pushes to main run Linux and
# Windows. macOS (tests and the iOS check) runs weekly and on manual dispatch only: on every main push it cost about
# a quarter of all billed minutes. Docs-only changes skip CI. Caches are saved from main only and restored by PRs.

name: CI

on:
  pull_request:
    paths-ignore: ["docs/**", "**/*.md"]
  push:
    branches: [main]
    paths-ignore: ["docs/**", "**/*.md"]
  # macOS tests and the iOS check (see the header). The conductor also dispatches it before closing a milestone.
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # RUSTFLAGS stays unset on purpose: changing it rebuilds every dependency and splits the cache. Clippy denies
  # warnings itself, and setup-rust-toolchain sets CARGO_BUILD_WARNINGS=deny for our own crates.

jobs:
  lint:
    name: Lint and layout
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Installs the toolchain and components pinned in rust-toolchain.toml.
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          cache: false
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: rustfmt
        run: cargo fmt --check
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Layout rules (ADR 0001)
        run: cargo xtask check-layout
      - name: API dump and Luau definitions are up to date (api/)
        run: cargo xtask api-dump --check
      - name: Headless engine (dedicated server features)
        run: cargo check -p metallic_engine --no-default-features --features physics,luau
      # A dedicated server needs user paths, not windows: metallic_platform's `window` feature stays off (#92).
      - name: Headless engine builds no window stack
        run: |
          if cargo tree -p metallic_engine --no-default-features --features physics,luau -e normal --prefix none \
              | grep -E '^(winit|gilrs|raw-window-handle) '; then
            echo "::error::the headless engine build depends on a window crate (see the lines above)"
            exit 1
          fi

  # The generated Luau definitions (api/metallic.d.luau) must load in luau-lsp, the editor tooling they are for: the
  # sample script type-checks cleanly and the deliberately wrong one fails with its four errors. The lint job checks
  # the committed file is fresh, so this checks the committed file. No Rust needed.
  luau-types:
    name: Luau type definitions (luau-lsp)
    runs-on: ubuntu-latest
    env:
      LUAU_LSP_VERSION: "1.70.1"
      LUAU_LSP_SHA256: 1a2ea1ae4f98f8946cefd970a4b54853e11ab4775e6932faa7f60cf920346567
    steps:
      - uses: actions/checkout@v7
      - name: Install luau-lsp ${{ env.LUAU_LSP_VERSION }}
        run: |
          curl -fsSL -o "$RUNNER_TEMP/luau-lsp.zip" \
            "https://github.com/JohnnyMorganz/luau-lsp/releases/download/$LUAU_LSP_VERSION/luau-lsp-linux-x86_64.zip"
          echo "$LUAU_LSP_SHA256  $RUNNER_TEMP/luau-lsp.zip" | sha256sum --check
          unzip -q "$RUNNER_TEMP/luau-lsp.zip" -d "$RUNNER_TEMP/luau-lsp"
          chmod +x "$RUNNER_TEMP/luau-lsp/luau-lsp"
          echo "$RUNNER_TEMP/luau-lsp" >> "$GITHUB_PATH"
      - name: The sample script type-checks
        run: luau-lsp analyze --platform=standard --definitions=@metallic=api/metallic.d.luau api/samples/instance_api.luau
      - name: The Player's embedded scenes type-check
        run: |
          shopt -s nullglob
          scenes=(apps/player/src/scenes/*.luau)
          if [ "${#scenes[@]}" = 0 ]; then
            echo "::error::no scripts in apps/player/src/scenes"
            exit 1
          fi
          luau-lsp analyze --platform=standard --definitions=@metallic=api/metallic.d.luau "${scenes[@]}"
      - name: Type errors are caught
        run: |
          if luau-lsp analyze --platform=standard --definitions=@metallic=api/metallic.d.luau \
              api/samples/type_error.luau > "$RUNNER_TEMP/errors.txt" 2>&1; then
            cat "$RUNNER_TEMP/errors.txt"
            echo "::error::luau-lsp accepted api/samples/type_error.luau, which has four type errors"
            exit 1
          fi
          cat "$RUNNER_TEMP/errors.txt"
          found=$(grep -c 'type_error.luau([0-9]*,[0-9]*): TypeError' "$RUNNER_TEMP/errors.txt" || true)
          if [ "$found" != 4 ]; then
            echo "::error::expected 4 type errors in api/samples/type_error.luau, luau-lsp reported $found"
            exit 1
          fi

  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # macOS only on the weekly or dispatched run: a macOS minute costs ten Linux minutes.
        os: >-
          ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
              && fromJSON('["ubuntu-latest", "windows-latest", "macos-latest"]')
              || fromJSON('["ubuntu-latest", "windows-latest"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          cache: false
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # The renderer's GPU tests (crates/render/tests) need an adapter, and runners have no GPU. Linux gets Mesa's
      # software rasterisers: lavapipe (Vulkan, the primary path) and llvmpipe through EGL (the GL fallback). Windows
      # has WARP, Direct3D 12's built-in software adapter. METALLIC_REQUIRE_GPU makes a missing adapter fail the
      # tests instead of skipping them, so the renderer is really tested here. (macOS, weekly only, skips without
      # one.)
      #
      # The Vulkan loader sees only lavapipe's driver (VK_DRIVER_FILES). mesa-vulkan-drivers installs eight, and
      # loader 1.4.341 (ubuntu-26.04's libvulkan1) unloads the ones without a device in vkEnumeratePhysicalDevices,
      # freeing them while another thread's vkSetDebugUtilsObjectNameEXT walks every instance's driver list: wgpu
      # names its objects in debug builds, and the tests make devices on several threads, so test binaries crashed
      # in libvulkan (#129). Fixed upstream in loader 1.4.345 (KhronosGroup/Vulkan-Loader#1866); this can go once the
      # image ships that. With one driver, which has a device, nothing is unloaded.
      - name: Software GPU (Mesa lavapipe and llvmpipe)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends mesa-vulkan-drivers libegl1 libegl-mesa0 libgl1-mesa-dri
          lavapipe=/usr/share/vulkan/icd.d/lvp_icd.json
          test -f "$lavapipe" || { echo "::error::no lavapipe driver manifest at $lavapipe"; exit 1; }
          echo "VK_DRIVER_FILES=$lavapipe" >> "$GITHUB_ENV"
      - name: Require a GPU adapter for the renderer tests
        if: matrix.os != 'macos-latest'
        shell: bash
        run: echo "METALLIC_REQUIRE_GPU=1" >> "$GITHUB_ENV"
      - run: cargo test --workspace
      # The renderer's image tests again on the GL fallback (llvmpipe through EGL), the path phones and older
      # hardware take. The run above picks Vulkan (lavapipe) whenever it has an adapter, so GL otherwise only gets
      # device setup (tests/offscreen.rs), which is how GL bugs like #155 went unseen. WGPU_BACKEND=gl leaves GL the
      # only backend, so with METALLIC_REQUIRE_GPU a missing GL adapter fails here. The binaries are the ones built
      # above; only the runs are new. Left out: no_alloc.rs, whose heap-growth tests are flaky on GL (#151), and
      # pipelines.rs, whose first-frame test fails on GL (#156).
      - name: Renderer image tests on GL (llvmpipe)
        if: runner.os == 'Linux'
        env:
          WGPU_BACKEND: gl
        run: >-
          cargo test -p metallic_render --test parts --test shadows --test lights --test post --test resolution
          --test sky --test lod --test overlay --test gpu_scene --test timings -- --nocapture
      # An image test that differs from its reference writes what it drew to target/tmp; keep it to look at.
      - name: Keep the images that differ
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: differing-images-${{ matrix.os }}
          path: target/tmp/*.png
          if-no-files-found: ignore
          retention-days: 7
      # Script errors are C++ exceptions unwinding through Rust frames, which only works with the panic strategy of
      # the profile that ships (`dist`); tests use the default and cannot see it. This runs every Luau error path in
      # `dist` and fails on an abort (crates/luau/src/ffi.rs). LTO is turned down to keep it cheap; the panic
      # strategy, the thing under test, comes from the profile.
      - name: Luau error paths in the shipped profile
        if: runner.os == 'Linux'
        env:
          CARGO_PROFILE_DIST_LTO: "false"
          CARGO_PROFILE_DIST_CODEGEN_UNITS: "16"
        run: cargo run -p metallic_luau --example error_smoke --profile dist
      # Luau's native code generator (`--features jit`, off by default) compiles scripts to machine code, which
      # checks the interrupt its own way; the time budget's watchdog (crates/luau/src/watchdog.rs) must stop runaway
      # native loops too. Dependencies, Luau's C++ included, are optimised in the test profile (Cargo.toml).
      - name: Luau tests with native code (jit)
        if: runner.os == 'Linux'
        run: cargo test -p metallic_luau --features jit

  # Everything that must build on mobile: the engine crates, Player and Launcher. Studio is desktop-only and xtask
  # is a host tool. Since #46 the engine contains C++ (Luau, built by mlua's build script), so `cargo check` for a
  # mobile target needs that target's C/C++ toolchain, not just the Rust target.
  cross-check-android:
    name: Cross-target check (Android)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          cache: false
      - run: rustup target add aarch64-linux-android
      - uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r27c
          add-to-path: false
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Android (aarch64-linux-android)
        env:
          NDK_BIN: ${{ steps.ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin
        run: |
          # cc-rs reads the target's compilers from these; API level 24 is the oldest the engine targets.
          export CC_aarch64_linux_android="$NDK_BIN/aarch64-linux-android24-clang"
          export CXX_aarch64_linux_android="$NDK_BIN/aarch64-linux-android24-clang++"
          export AR_aarch64_linux_android="$NDK_BIN/llvm-ar"
          cargo check --workspace --exclude metallic_studio --exclude xtask --target aarch64-linux-android

  # iOS needs the SDK that ships with Xcode, which only macOS runners have, and a macOS minute costs ten Linux
  # minutes, so it runs weekly and on dispatch only (like the macOS tests). Android, checked on every PR, catches
  # most portability breaks.
  cross-check-ios:
    name: Cross-target check (iOS)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          cache: false
      - run: rustup target add aarch64-apple-ios
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: iOS (aarch64-apple-ios)
        run: cargo check --workspace --exclude metallic_studio --exclude xtask --target aarch64-apple-ios

  deny:
    name: cargo-deny (advisories, licenses, sources)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2.1.1
        with:
          command: check
