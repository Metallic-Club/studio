[graph]
all-features = true

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "Zlib",
    "ISC",
    "Unicode-3.0",
    "MPL-2.0",
]
confidence-threshold = 0.8
# Needs a lead/owner decision (task 13): the Velopack updater pulls in ureq with the Mozilla CA bundle,
# whose licence is the permissive data licence CDLA-Permissive-2.0. Allowed for this one crate only.
exceptions = [
    { crate = "webpki-roots", allow = ["CDLA-Permissive-2.0"] },
]

[licenses.private]
ignore = true
