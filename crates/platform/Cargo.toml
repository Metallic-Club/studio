[package]
name = "metallic_platform"
description = "Metallic platform layer: window, input, paths, OS glue"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
default = ["window"]
# Windows, the event loop, input and gamepads (winit, gilrs, raw-window-handle). A dedicated server builds without
# it: it needs user paths, not windows. `metallic_engine`'s `render` feature turns it on (#92).
window = ["dep:winit", "dep:gilrs", "dep:raw-window-handle"]

[dependencies]
raw-window-handle = { workspace = true, optional = true }
thiserror.workspace = true
log.workspace = true

# Desktop: winit's Win32, AppKit, X11 and Wayland backends. User folders need no crate: `directories` and `dirs`
# pull `option-ext`, which is MPL-2.0 (not on deny.toml's list), and the rules are a few lines (src/paths.rs).
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
winit = { workspace = true, optional = true }

# Gamepads through gilrs on Windows (Windows.Gaming.Input) and macOS (IOKit), which need no system packages. Not on
# Linux: gilrs links libudev there (libudev-sys, pkg-config, libudev-dev), which every Linux build, CI runner and
# dedicated server would then need. Linux reports no gamepads until that is decided (see src/gamepad.rs).
[target.'cfg(any(target_os = "windows", target_os = "macos"))'.dependencies]
gilrs = { workspace = true, optional = true }

# winit refuses to build on Android without an activity backend. NativeActivity is pure Rust (GameActivity compiles
# C++); the real Android entry point is M9 work, until then the code only has to compile.
[target.'cfg(target_os = "android")'.dependencies]
winit = { workspace = true, optional = true, features = ["android-native-activity"] }

# The per-user file association (src/file_types.rs): the registry, and telling Explorer it changed.
[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { workspace = true, features = ["Win32_System_Registry", "Win32_UI_Shell"] }

[target.'cfg(target_os = "ios")'.dependencies]
winit = { workspace = true, optional = true }

[[example]]
name = "window"
required-features = ["window"]
