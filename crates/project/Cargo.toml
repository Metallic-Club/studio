[package]
name = "metallic_project"
description = "Metallic projects: manifest, scenes, assets, packaging"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
metallic_core.workspace = true
crc32fast.workspace = true
getrandom.workspace = true
serde.workspace = true
# `float_roundtrip` reads every number back as exactly the value that was written, so a scene saved, loaded and
# saved again is the same file byte for byte.
serde_json = { workspace = true, features = ["float_roundtrip"] }
thiserror.workspace = true
toml.workspace = true
zip.workspace = true

[dev-dependencies]
# The built-in classes, for tests that save and load real games (ADR 0001's rules exempt dev-dependencies).
metallic_classes.workspace = true
