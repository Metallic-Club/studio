[package]
name = "metallic_vfx"
description = "Metallic VFX: particle systems, trails and beams with a deterministic CPU reference simulator."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
ron = "0.12.3"
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.21"

[dev-dependencies]
naga = { version = "30.0.1", features = ["wgsl-in"] }
criterion = { version = "0.8.2", default-features = false }

[[bench]]
name = "update"
harness = false
