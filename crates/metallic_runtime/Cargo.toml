[package]
name = "metallic_runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
metallic_core.workspace = true
metallic_physics.workspace = true
metallic_script.workspace = true
metallic_render.workspace = true
# Painter only: no bundled fonts (their OFL/Ubuntu licences are not on our allow list); `gui.rs` loads a system font.
egui = { version = "0.37.0", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.21"
wgpu = "30.0.1"
toml = "1.1.8"
