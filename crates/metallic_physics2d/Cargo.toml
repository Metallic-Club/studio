[package]
name = "metallic_physics2d"
description = "2D rigid-body physics and a platformer character controller for the Metallic Engine."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = []
## Bit-identical results across platforms and compilers (rapier2d `enhanced-determinism`):
## software maths instead of SIMD, slower. For lockstep/rollback multiplayer later.
cross-platform-determinism = ["rapier2d/enhanced-determinism"]

[dependencies]
rapier2d.workspace = true

[dev-dependencies]
criterion.workspace = true
eframe = { version = "0.37.0", default-features = false, features = ["default_fonts", "wgpu", "wayland", "x11"] }
egui_kittest = { version = "0.37.0", features = ["wgpu"] }
image = { version = "0.25", default-features = false, features = ["png"] }

[[bench]]
name = "step"
harness = false

[[example]]
name = "physics2d_demo"
