[package]
name = "metallic_meshgen"
description = "CPU mesh generation for every Metallic Part shape: bevels, normals, tangents, world-scale UVs, LODs, collider hints."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = []
# Derives `bytemuck::Pod`/`Zeroable` on `Vertex` so the renderer can upload `MeshData::interleaved()` directly.
bytemuck = ["dep:bytemuck"]

[dependencies]
glam = "0.30.10"
thiserror = "2.0.21"
bytemuck = { version = "1.25.2", features = ["derive"], optional = true }

[dev-dependencies]
criterion.workspace = true
png = "0.18.1"
# Reference implementation, used only by a test that checks our tangents match MikkTSpace.
mikktspace = { version = "0.3.0", default-features = false, features = ["glam"] }

[[bench]]
name = "meshgen"
harness = false
