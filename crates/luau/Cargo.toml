[package]
name = "metallic_luau"
description = "Metallic Luau scripting backend"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# Luau native code generation (the "JIT"). Allowed only on x86-64 and aarch64 Windows, Linux, macOS and Android:
# `build.rs` fails the build when it is enabled for any other target, because iOS and consoles forbid generating
# machine code at run time (ADR 0003).
jit = ["mlua/luau-jit"]

[dependencies]
metallic_core.workspace = true
metallic_script.workspace = true
mlua.workspace = true
thiserror.workspace = true

[dev-dependencies]
# Tests and benches run real scripts against the real class set. Dev-dependencies are exempt from the layout rules
# (ADR 0001).
metallic_classes.workspace = true
criterion.workspace = true
gungraun.workspace = true

[[bench]]
name = "api"
harness = false

# The perf gate's Luau suite (docs/perf.md). It needs Valgrind and `gungraun-runner`, so a plain `cargo bench`
# leaves it out (`bench = false`); it runs by name: `cargo bench -p metallic_luau --bench perf_gate`.
[[bench]]
name = "perf_gate"
harness = false
bench = false
