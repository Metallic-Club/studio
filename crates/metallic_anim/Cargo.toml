[package]
name = "metallic_anim"
description = "Animation data model and runtime for Metallic: curves, easing, clips, skeletons, blending, state machines, tweens, IK."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
glam = { version = "0.30.10", features = ["serde"] }
ron = "0.12.3"
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.21"

[dev-dependencies]
criterion.workspace = true

[[bench]]
name = "sample"
harness = false
