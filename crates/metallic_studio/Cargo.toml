[package]
name = "metallic_studio"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "metallic_studio"
path = "src/lib.rs"

[[bin]]
name = "metallic-studio"
path = "src/main.rs"

[dependencies]
metallic_profiler.workspace = true
metallic_core.workspace = true
metallic_render.workspace = true
metallic_runtime.workspace = true
metallic_script.workspace = true
# Same wgpu major as metallic_render (30); Task 10 shares one device with the viewport.
eframe = { version = "0.37.0", default-features = false, features = ["wgpu"] }
rfd = "0.17.2"
toml = "1.1.8"
ron = "0.12.3"
serde = { version = "1", features = ["derive"] }
thiserror = "2"
png = "0.18.1"
# Same wgpu as metallic_render and egui-wgpu: the viewport texture is shared with egui.
wgpu = "30.0.1"
# Double-precision maths for the building-tool cores (src/tools); same version as metallic_render.
glam = "0.30.10"
log = "0.4"
env_logger = { version = "0.11", default-features = false, features = ["humantime"] }
metallic_update.workspace = true
# Colours, sizes and type scale for the theme; fonts live in metallic_ui_theme.
metallic_tokens.workspace = true
metallic_ui_theme.workspace = true
velopack = "1.3.39-g8d2844f"

[dev-dependencies]
metallic_core.workspace = true
tempfile = "3"
egui_kittest = { version = "0.37.0", features = ["wgpu"] }
