[package]
name = "metallic_launcher"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "metallic_launcher"
path = "src/lib.rs"

[[bin]]
name = "Metallic"
path = "src/main.rs"

[dependencies]
metallic_update.workspace = true
metallic_tokens.workspace = true
url = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1.8"
thiserror = "2"
log = "0.4"
sha2 = "0.10"
env_logger = "0.11"
wry = { version = "0.57", features = ["devtools"] }
tao = "0.37"
png = "0.18"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_IO",
    "Win32_System_Pipes",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
tray-icon = { version = "0.25", default-features = false }
webview2-com = "0.39"

[dev-dependencies]
tempfile = "3"
semver = "1"
