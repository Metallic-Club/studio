[package]
name = "metallic_vfx_editor"
description = "Metallic VFX editor: module stack, node graph, curve and gradient widgets, live preview (egui)."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
metallic_vfx = { path = "../metallic_vfx" }
egui = { version = "0.37.0", default-features = false }

[dev-dependencies]
eframe = { version = "0.37.0", default-features = false, features = ["wgpu", "accesskit", "clipboard", "wayland", "x11"] }
egui_kittest = { version = "0.37.0", features = ["wgpu"] }
image = { version = "0.25.10", default-features = false, features = ["png"] }
