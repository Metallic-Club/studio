[package]
name = "metallic_core"
description = "Metallic object model: values, math, ids, class registry, data model, signals"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
glam.workspace = true
serde.workspace = true
thiserror.workspace = true

[dev-dependencies]
serde_json.workspace = true
criterion.workspace = true
gungraun.workspace = true

[[bench]]
name = "registry"
harness = false

[[bench]]
name = "data_model"
harness = false

# The perf gate's instruction counts (docs/perf.md). They need Valgrind and `gungraun-runner`, so a plain
# `cargo bench` leaves this target out (`bench = false`); it runs by name: `cargo bench --bench perf_gate`.
[[bench]]
name = "perf_gate"
harness = false
bench = false
