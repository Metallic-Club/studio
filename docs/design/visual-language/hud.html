<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Parkour HUD</title>
<link rel="stylesheet" href="assets/mockup-fonts.css">
<link rel="stylesheet" href="assets/tokens.css">
<style>
  /* HUD sizes are for a 1080 px tall screen; the game scales them by screen height / 1080 (clamped 0.75 to 1.5). */
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; font-family: var(--font); -webkit-font-smoothing: antialiased; }
  .scene { position: fixed; inset: 0 0 -7vh 0; background: top center / cover no-repeat url(assets/parkour-checkpoint-clean.jpg); } /* bottom 7% cropped: it held the old HUD hint */
  .finish .scene { background-image: url(assets/parkour-finish-clean.jpg); }
  :root { --hud: calc(100vh / 1080); --plate: rgba(17, 16, 21, 0.88); }

  /* The tag: hangs from the top edge, two cut corners below (the Metallic cut, mirrored) */
  .tag { position: fixed; left: 50%; top: 0; transform: translateX(-50%); background: var(--plate); text-align: center;
    padding: 26px 56px 26px; min-width: 300px;
    clip-path: polygon(0 0, 100% 0, 100% calc(100% - 16px), calc(100% - 16px) 100%, 16px 100%, 0 calc(100% - 16px)); }
  /* Motion (in the game): slides down from above the screen edge, 220 ms cubic-out; leaves after 2.5 s with a 150 ms fade. Not animated in this still. */
  .tag .k { font: 600 17px/22px var(--font); font-stretch: 112.5%; color: var(--text-2); letter-spacing: 0.01em; }
  .tag .v { font: 800 44px/50px var(--font); font-stretch: 125%; color: var(--g-50); letter-spacing: -0.01em; margin-top: 2px; }
  .tag .v.time { font: 700 52px/58px var(--mono); letter-spacing: -0.02em; }
  .pips { display: flex; gap: 6px; justify-content: center; margin-top: 12px; }
  .pips i { width: 44px; height: 5px; background: var(--g-600); display: block; }
  .pips i.f { background: var(--accent); }
  .tag .sub { font: 500 16px/22px var(--font); color: var(--text-2); margin-top: 8px; }

  /* Run timer: small plate top right, mono so digits do not jump */
  .timer { position: fixed; right: 32px; top: 28px; background: var(--plate); padding: 8px 14px 8px 12px; display: flex; align-items: center; gap: 10px;
    clip-path: polygon(0 0, calc(100% - 10px) 0, 100% 10px, 100% 100%, 0 100%); }
  .timer .ph { font-size: 22px; color: var(--icon); }
  .timer span { font: 600 26px/30px var(--mono); color: var(--g-50); }

  /* Controls hint: bottom left, keycaps */
  .keys { position: fixed; left: 32px; bottom: 32px; background: var(--plate); padding: 10px 14px; display: flex; gap: 22px; align-items: center; border-radius: var(--r-sm); }
  .keys .g { display: flex; gap: 8px; align-items: center; font: 500 16px/20px var(--font); color: var(--text-2); }
  .cap { font: 600 14px/22px var(--font); color: var(--text-1); background: var(--g-650); box-shadow: inset 0 -2px 0 var(--g-800); border-radius: var(--r-xs); padding: 0 7px; min-width: 22px; text-align: center; }
  .caps { display: flex; gap: 3px; }
  .finish .timer { display: none; }
</style>
</head>
<body>
<div class="scene" aria-hidden="true"></div>
<div class="tag" id="tag" role="status" aria-live="polite"></div>
<div class="timer" aria-label="Run time"><i class="ph" aria-hidden="true">&#xe492;</i><span>0:04.62</span></div>
<div class="keys" aria-label="Controls">
  <span class="g"><span class="caps"><span class="cap">W</span><span class="cap">A</span><span class="cap">S</span><span class="cap">D</span></span>Move</span>
  <span class="g"><span class="cap">Space</span>Jump</span>
  <span class="g"><span class="cap">Shift</span>Run</span>
  <span class="g"><span class="cap">Right mouse</span>Turn camera</span>
</div>
<script>
const finish = new URLSearchParams(location.search).get('state') === 'finish';
document.body.classList.toggle('finish', finish);
document.getElementById('tag').innerHTML = finish
  ? `<div class="k">Finish</div><div class="v time">0:07.04</div><div class="pips"><i class="f"></i><i class="f"></i><i class="f"></i></div><div class="sub">All 3 checkpoints</div>`
  : `<div class="k">Checkpoint</div><div class="v">2 of 3</div><div class="pips"><i class="f"></i><i class="f"></i><i></i></div>`;
</script>
</body>
</html>
